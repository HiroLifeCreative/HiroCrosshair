<!DOCTYPE html>
<html>
<head>
    <title>com.hiro.crosshair</title>
    <meta charset="utf-8" />
</head>
<body>
    <script>
        let websocket = null;
        let pluginUUID = null;

        function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo) {
            pluginUUID = inPluginUUID;
            websocket = new WebSocket("ws://127.0.0.1:" + inPort);

            websocket.onopen = function() {
                var json = {
                    "event": inRegisterEvent,
                    "uuid": inPluginUUID
                };
                websocket.send(JSON.stringify(json));
            };

            websocket.onmessage = function(evt) {
                var jsonObj = JSON.parse(evt.data);
                var event = jsonObj['event'];
                var action = jsonObj['action'];
                var context = jsonObj['context'];
                var payload = jsonObj['payload'];

                if(event === "keyDown") {
                    const settings = payload.settings || {};
                    let command = "toggle";
                    
                    if (action === "com.hiro.crosshair.select") {
                        if (settings.gameId && settings.overlayId) {
                            command = `overlay:${settings.gameId}:${settings.overlayId}`;
                        } else if (settings.gameId) {
                            command = `game:${settings.gameId}`;
                        }
                    }

                    // Send to HiroCrosshair TCP Server
                    // Note: Stream Deck JS doesn't have raw TCP, but we can use a small local fetch 
                    // IF we had an HTTP bridge, OR we can use the "Run Command" trick from within JS.
                    // However, the cleanest way is for the user to use the Powershell command 
                    // but since they want a PLUGIN, we'll provide a JS bridge.
                    
                    // Actually, HiroCrosshair TCP is simple. We can use a simple fetch if we add an HTTP listener to Hiro.
                    // But for now, let's use the simplest method: calling a local helper or using the fetch if Hiro had HTTP.
                    
                    // I will update Hiro's Rust to also accept HTTP GET for easier Stream Deck integration.
                    fetch(`http://127.0.0.1:1421/cmd?c=${command}`).catch(() => {});
                }
            };
        }
    </script>
</body>
</html>
