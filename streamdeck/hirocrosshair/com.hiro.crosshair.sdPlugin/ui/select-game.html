<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>HiroCrosshair - Select Game</title>
    <link rel="stylesheet" href="css/sdpi.css">
    <script src="js/sdpi.js"></script>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Target</div>
            <select id="game-selector" class="sdpi-item-value" onchange="saveSettings()">
                <option value="">Loading Games...</option>
            </select>
        </div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Refresh</div>
            <button class="sdpi-item-value" onclick="loadGames()">Sync App</button>
        </div>
    </div>

    <script>
        let currentSettings = {};

        // Listen for connection and settings
        $SD.onDidReceiveSettings('com.hiro.crosshair.select', (data) => {
            currentSettings = data.payload.settings || {};

            const gameSelector = document.getElementById('game-selector');
            if (currentSettings.id && gameSelector.options.length > 1) {
                gameSelector.value = currentSettings.id;
            }
        });

        async function loadGames() {
            const selector = document.getElementById('game-selector');
            try {
                const response = await fetch('http://localhost:1422/list');
                const games = await response.json();
                
                selector.innerHTML = '<option value="">-- Choose Target --</option>';
                games.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    selector.appendChild(opt);
                });

                if (currentSettings.id) {
                    selector.value = currentSettings.id;
                }
            } catch (error) {
                console.error("Error loading games:", error);
                selector.innerHTML = '<option value="">App disconnected</option>';
            }
        }

        function saveSettings() {
            const gameId = document.getElementById('game-selector').value;
            
            currentSettings.type = 'game'; // Hardcoded to game profile
            currentSettings.id = gameId;
            $SD.setSettings(currentSettings);

            if (!gameId) return;
            
            fetch(`http://localhost:1422/?c=game:${gameId}`).catch(err => console.error(err));
        }

        // Initial load
        loadGames();
    </script>
</body>
</html>
